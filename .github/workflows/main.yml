name: Build

on:
  push:
    branches: [ main, experimental ]
  pull_request:
    branches: [ main, experimental ]
  workflow_dispatch:

jobs:
  buildUWP:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4.1.7

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.4

      # 1. Inicializar MSVC en 64 bits
      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 2. Instalar librerias del proyecto
      - name: Install Haxelib
        run: |
          haxelib setup C:/haxelib
          call .\setup\windows.bat
          haxelib install hxcpp --always --quiet
          haxelib install format --always --quiet
        shell: cmd

      # 3. Clonar Lime, parchar SDL y copiar lime.ndll
      - name: Clone and Rebuild Lime for WinRT64
        shell: pwsh
        run: |
          git clone --recursive --depth 1 --branch 8.1.2 https://github.com/openfl/lime.git C:/lime-src
          Set-Content -Path "C:/lime-src/project/lib/sdl/src/video/winrt/SDL_winrtgamebar.cpp" -Value "struct SDL_VideoDevice;`nvoid WINRT_InitGameBar(SDL_VideoDevice *_this) {}`nvoid WINRT_QuitGameBar(SDL_VideoDevice *_this) {}"
          Push-Location "C:/lime-src/project"
          haxelib run hxcpp Build.xml -Dwinrt -DHXCPP_M64
          Pop-Location
          New-Item -ItemType Directory -Force -Path "C:/haxelib/lime/8,1,2/ndll/WinRT64"
          Copy-Item -Path "C:/lime-src/ndll/WinRT64/lime.ndll" -Destination "C:/haxelib/lime/8,1,2/ndll/WinRT64/lime.ndll" -Force
          Get-ChildItem "C:/haxelib/lime/8,1,2/ndll/WinRT64"

      # 4. Parchar Native.hx, Socket.cpp, msvc-toolchain.xml y Project.xml
      - name: Patch Files for UWP
        shell: pwsh
        run: |
          Set-Content -Path "source/backend/Native.hx" -Value "package backend;`nclass Native {`npublic static function __init__():Void {}`npublic static function registerDPIAware():Void {}`npublic static function fixScaling():Void {}`n}"
          (Get-Content "C:/haxelib/hxcpp/4,3,2/include/hxString.h").Replace("String(Platform::String ^", "explicit String(Platform::String ^") | Set-Content "C:/haxelib/hxcpp/4,3,2/include/hxString.h"
          (Get-Content "C:/haxelib/hxcpp/4,3,2/src/hx/libs/std/Build.xml").Replace('File name="Socket.cpp" unless="winrt"', 'File name="Socket.cpp"') | Set-Content "C:/haxelib/hxcpp/4,3,2/src/hx/libs/std/Build.xml"
          (Get-Content "C:/haxelib/hxcpp/4,3,2/src/hx/libs/std/Socket.cpp").Replace("!defined(HX_WINRT)", "1") | Set-Content "C:/haxelib/hxcpp/4,3,2/src/hx/libs/std/Socket.cpp"
          Add-Content -Path "C:/haxelib/hxcpp/4,3,2/src/hx/libs/std/Socket.cpp" -Value "`nextern `"C`" int __stdcall CryptAcquireContextA(void*, const char*, const char*, unsigned long, unsigned long);`nextern `"C`" int CryptAcquireContext(void* a, const char* b, const char* c, unsigned long d, unsigned long e) { return CryptAcquireContextA(a, b, c, d, e); }`n"
          $tc = Get-Content "C:/haxelib/hxcpp/4,3,2/toolchain/msvc-toolchain.xml" -Raw
          $tc =$tc.Replace('</linker>', '<lib name="WindowsApp.lib"/><lib name="runtimeobject.lib"/><lib name="kernel32.lib"/><lib name="user32.lib"/><lib name="advapi32.lib"/><lib name="ws2_32.lib"/><lib name="ole32.lib"/><lib name="crypt32.lib"/></linker>')
          Set-Content "C:/haxelib/hxcpp/4,3,2/toolchain/msvc-toolchain.xml" -Value $tc
          if (Test-Path "Project.xml") {
            $proj = Get-Content "Project.xml" -Raw
            $proj =$proj -replace '<haxelib name="hxdiscord_rpc"[^>]*>', ''
            $proj =$proj -replace '<define name="DISCORD_ALLOWED"[^>]*/>', ''
            $proj =$proj -replace '<haxelib name="linc_luajit"[^>]*>', ''
            $proj =$proj -replace '<define name="LUA_ALLOWED"[^>]*/>', ''
            Set-Content "Project.xml" -Value $proj
          }

      - name: Skip SScript setup mode
        run: echo 'oy9:showMacroty8:loopCosti25y10:includeAllfg' >> %USERPROFILE%/settings.cocoa
        shell: cmd

      - name: Create Version Tag
        run: echo "${{github.run_id}}" > VERSION

      # 5. Compilar el proyecto para WinRT en 64 bits
      - name: Compile
        run: haxelib run lime build winrt -64 --app-version="4.0.0-${{ github.run_id}}" -D officialBuild
        shell: cmd

      # 6. Crear paquete .appx firmado y certificado .cer listos para Xbox Dev Mode
      - name: Package and Sign APPX for Xbox
        shell: pwsh
        run: |
          $binDir = "export/release/winrt/bin"
          New-Item -ItemType Directory -Force -Path "export/xbox_ready"
          Add-Type -AssemblyName System.Drawing
          $bmp150 = New-Object System.Drawing.Bitmap(150, 150)
          $bmp150.Save("$binDir/Logo.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp44 = New-Object System.Drawing.Bitmap(44, 44)
          $bmp44.Save("$binDir/SmallLogo.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp50 = New-Object System.Drawing.Bitmap(50, 50)
          $bmp50.Save("$binDir/StoreLogo.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $bmp620 = New-Object System.Drawing.Bitmap(620, 300)
          $bmp620.Save("$binDir/SplashScreen.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $exeFile = (Get-ChildItem -Path$binDir -Filter "*.exe" | Select-Object -First 1).Name
          $manifestXml = @"
          <?xml version="1.0" encoding="utf-8"?>
          <Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10" xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10" IgnorableNamespaces="uap">
            <Identity Name="PsychEngineXbox" Publisher="CN=PsychEngine" Version="1.0.0.0" ProcessorArchitecture="x64" />
            <Properties>
              <DisplayName>FNF Psych Engine</DisplayName>
              <PublisherDisplayName>PsychEngine</PublisherDisplayName>
              <Logo>StoreLogo.png</Logo>
            </Properties>
            <Dependencies>
              <TargetDeviceFamily Name="Windows.Universal" MinVersion="10.0.10240.0" MaxVersionTested="10.0.22621.0" />
              <TargetDeviceFamily Name="Windows.Xbox" MinVersion="10.0.10240.0" MaxVersionTested="10.0.22621.0" />
              <PackageDependency Name="Microsoft.VCLibs.140.00" MinVersion="14.0.0.0" Publisher="CN=Microsoft Corporation, O=Microsoft Corporation, L=Redmond, S=Washington, C=US" />
            </Dependencies>
            <Resources>
              <Resource Language="en-us" />
            </Resources>
            <Applications>
              <Application Id="App" Executable="$exeFile" EntryPoint="PsychEngineXbox.App">
                <uap:VisualElements DisplayName="FNF Psych Engine" Square150x150Logo="Logo.png" Square44x44Logo="SmallLogo.png" Description="Psych Engine UWP" BackgroundColor="transparent">
                  <uap:SplashScreen Image="SplashScreen.png" />
                </uap:VisualElements>
              </Application>
            </Applications>
            <Capabilities>
              <Capability Name="internetClient" />
            </Capabilities>
          </Package>
          "@
          Set-Content -Path "$binDir/AppxManifest.xml" -Value $manifestXml -Encoding UTF8$cert = New-SelfSignedCertificate -Type Custom -Subject "CN=PsychEngine" -KeyUsage DigitalSignature -FriendlyName "PsychEngineCert" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pwd = ConvertTo-SecureString -String "1234" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "export/xbox_ready/PsychEngine.pfx" -Password $pwd
          Export-Certificate -Cert $cert -FilePath "export/xbox_ready/PsychEngine.cer"
          makeappx pack /d "$binDir" /p "export/xbox_ready/PsychEngine.appx" /o
          signtool sign /fd SHA256 /a /f "export/xbox_ready/PsychEngine.pfx" /p "1234" "export/xbox_ready/PsychEngine.appx"
          $vclibs = Get-ChildItem -Path "C:\Program Files (x86)\Microsoft SDKs\Windows Kits\10\ExtensionSDKs\Microsoft.VCLibs" -Filter "*x64*.appx" -Recurse | Select-Object -First 1
          if ($vclibs) { Copy-Item$vclibs.FullName -Destination "export/xbox_ready/" }

      # 7. Subir solo los archivos listos para instalar en la Xbox
      - name: Publish Artifact
        uses: actions/upload-artifact@v4.3.4
        with:
          name: uwpXboxReady
          path: export/xbox_ready
